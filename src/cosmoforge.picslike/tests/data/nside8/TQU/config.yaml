nside: 8
spins: [0, 2]
labels: ["T", "E", "B"]
physical_labels: ["T", "Q", "U"]

do_cross: false

maskfile: '../tests/data/nside8/TQU/mask.fits'
output_geometry_file: '../tests/data/nside8/TQU/geometry.dat'
ordering: RING

inputclfile: '../tests/data/nside8/TQU/dls.txt'
input_convention: Dl
covmatfile1: '../tests/data/nside8/TQU/NCVM1.bin'
covmatfile2: '../tests/data/nside8/TQU/NCVM2.bin'

lmax: 32

load_inverted: false

smoothing_type: file
fwhmarcmin: 440.0
apply_pixwin: false
beam_file: '../scripts/beam_440TP_pixwin16.fits'

outnoisecovmat1: '../tests/data/nside8/TQU/reduced_NCVM1.bin'
outnoisecovmat2: '../tests/data/nside8/TQU/reduced_NCVM2.bin'

feedback: 4
outinvcovmatfile1: '../tests/data/nside8/TQU/invCOV1.bin'
outinvcovmatfile2: '../tests/data/nside8/TQU/invCOV2.bin'

# Fisher matrix output
outfilefisher: '../tests/data/nside8/TQU/fisher.dat'

# QML-specific parameters
nsims: 30
inputmapfile1: '../tests/data/nside8/maps/all_sims_TQU.fits'
inputmapfile2: '../tests/data/nside8/maps/all_sims_TQU.fits'

# Output files for QML
outcovmatfile: '../tests/data/nside8/TQU/cov_matrix.dat'
outerrfile: '../tests/data/nside8/TQU/errors.dat'

# Fisher matrix file (if precomputed)
outfilefisher: '../tests/data/nside8/TQU/fisher.dat'

parameters:
  amplitude: [0.95, 1.05, 10]
  tilt: [-0.2, 0.2, 10]

root_dir: '../tests/data/nside8/templates'
root_filename: 'dls'

# QML options
remove_nb: true
