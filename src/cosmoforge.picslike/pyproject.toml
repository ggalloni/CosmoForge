[project]
name = "picslike"
version = "0.1.3"
description = "PICSLike: Pixel-based Inference with Correlated-Skies Likelihood"
readme = "README.md"
authors = [
    { name = "Giacomo Galloni", email = "giacomo.galloni@unife.it" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "cosmocore",
    "tqdm>=4.67.1",
]

[tool.uv.sources]
cosmocore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["picslike"]

[tool.hatch.build.targets.sdist]
include = ["picslike"]

[tool.ruff.lint]
select = ["E713", "E703", "E714", "E741", "E10", "E11", "E20", "E22", "E23", "E25", "E262", "E27", "E301", "E302", "E304", "E9", "F405", "F406", "F5", "F6", "F7", "F8", "E501", "W191", "F401", "W1", "W292", "W293", "W3"]
extend-select = ["I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["picslike", "cosmocore", "cosmoforge"]
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"docs/*" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff]
exclude = ["build", ".eggs"]
line-length = 90

[tool.coverage.run]
source = ["src/"]
parallel = true
concurrency = ["multiprocessing"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/setup.py",
    "*/conftest.py",
    "*/.pytest_cache/*",
    "*/egg-info/*",
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "pass",
    "raise AssertionError",
    "raise NotImplementedError",
    "raise ValueError",
    "raise TypeError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "self.log",
    "@(numba\\.)?njit",
    "@(numba\\.)?jit",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]