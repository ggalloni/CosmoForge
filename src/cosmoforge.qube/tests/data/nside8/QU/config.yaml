nside: 8
spins: [2]
labels: ["E", "B"]
physical_labels: ["Q", "U"]

do_cross: false

maskfile: 'tests/data/nside8/QU/mask.fits'
output_geometry_file: 'tests/data/nside8/QU/geometry.dat'
ordering: RING

inputclfile: 'tests/data/nside8/QU/dls.txt'
covmatfile1: 'tests/data/nside8/QU/NCVM1.bin'
covmatfile2: 'tests/data/nside8/QU/NCVM2.bin'

lmax: 32

load_inverted: false

smoothing_type: gaussian
fwhmarcmin: 440.0
apply_pixwin: false
beam_file: 'scripts/beam_440TP_pixwin16.fits'

outnoisecovmat1: 'tests/data/nside8/QU/reduced_NCVM1.bin'
outnoisecovmat2: 'tests/data/nside8/QU/reduced_NCVM2.bin'

feedback: 1
outinvcovmatfile1: 'tests/data/nside8/QU/invCOV1.bin'
outinvcovmatfile2: 'tests/data/nside8/QU/invCOV2.bin'

# Fisher matrix output
outfilefisher: 'tests/data/nside8/QU/fisher.dat'

# QML-specific parameters
nsims: 300
inputmapfile1: 'tests/data/nside8/maps/all_sims_TQU.fits'
inputmapfile2: 'tests/data/nside8/maps/all_sims_TQU.fits'

# Output files for QML
outcovmatfile: 'tests/data/nside8/QU/cov_matrix.dat'
outerrfile: 'tests/data/nside8/QU/errors.dat'

# Fisher matrix file (if precomputed)
outfilefisher: 'tests/data/nside8/QU/fisher.dat'

# QML options
remove_nb: true

