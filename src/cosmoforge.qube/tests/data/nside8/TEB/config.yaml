nside: 8
spins: [0, 0, 0]
labels: ["T", "E", "B"]

do_cross: false

maskfile: 'tests/data/nside8/TEB/mask.fits'
output_geometry_file: 'tests/data/nside8/TEB/geometry.dat'
ordering: RING

inputclfile: 'tests/data/nside8/TEB/dls.txt'
covmatfile1: 'tests/data/nside8/TEB/NCVM1.bin'
covmatfile2: 'tests/data/nside8/TEB/NCVM2.bin'

lmax: 32

load_inverted: false
calibration: 1.0

smoothing_type: file
fwhmarcmin: 440.0
apply_pixwin: false
beam_file: 'scripts/beam_440TP_pixwin16.fits'

outnoisecovmat1: 'tests/data/nside8/TEB/reduced_NCVM1.bin'
outnoisecovmat2: 'tests/data/nside8/TEB/reduced_NCVM2.bin'

feedback: 0
outinvcovmatfile1: 'tests/data/nside8/TEB/invCOV1.bin'
outinvcovmatfile2: 'tests/data/nside8/TEB/invCOV2.bin'

# Fisher matrix output
outfilefisher: 'tests/data/nside8/TEB/fisher.dat'

# QML-specific parameters
nsims: 300
inputmapfile1: 'tests/data/nside8/maps/all_sims_TEB.fits'
inputmapfile2: 'tests/data/nside8/maps/all_sims_TEB.fits'

# Output files for QML
outcovmatfile: 'tests/data/nside8/TEB/cov_matrix.dat'
outerrfile: 'tests/data/nside8/TEB/errors.dat'

# Fisher matrix file (if precomputed)
outfilefisher: 'tests/data/nside8/TEB/fisher.dat'

# QML options
remove_nb: true
nspectra: 6
