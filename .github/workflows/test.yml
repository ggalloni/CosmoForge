name: Test CosmoForge Packages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      affected-packages: ${{ steps.changes.outputs.affected-packages }}
      test-cosmocore: ${{ steps.changes.outputs.test-cosmocore }}
      test-qube: ${{ steps.changes.outputs.test-qube }}
      test-picslike: ${{ steps.changes.outputs.test-picslike }}
      test-meta: ${{ steps.changes.outputs.test-meta }}
      test-all: ${{ steps.changes.outputs.test-all }}
      cosmocore-strategy: ${{ steps.changes.outputs.cosmocore-strategy }}
      qube-strategy: ${{ steps.changes.outputs.qube-strategy }}
      picslike-strategy: ${{ steps.changes.outputs.picslike-strategy }}
      meta-strategy: ${{ steps.changes.outputs.meta-strategy }}
      strategy: ${{ steps.changes.outputs.strategy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Detect changes and determine test strategy
        id: changes
        run: |
          # Run the change detection script
          output=$(python scripts/detect-changes.py origin/${{ github.event.repository.default_branch }})
          echo "$output"
          
          # Parse the output to set GitHub Actions outputs
          affected_packages=$(echo "$output" | grep "AFFECTED_PACKAGES=" | cut -d'=' -f2)
          
          # Set outputs for each package
          echo "affected-packages=$affected_packages" >> $GITHUB_OUTPUT
          
          # Check if we need to test all packages
          if echo "$output" | grep -q "TEST_ALL="; then
            echo "test-all=true" >> $GITHUB_OUTPUT
            echo "test-cosmocore=true" >> $GITHUB_OUTPUT
            echo "test-qube=true" >> $GITHUB_OUTPUT
            echo "test-picslike=true" >> $GITHUB_OUTPUT
            echo "test-meta=true" >> $GITHUB_OUTPUT

            # Parse individual strategies even in TEST_ALL case
            cosmocore_strategy=$(echo "$output" | grep "TEST_COSMOCORE=" | cut -d'=' -f2)
            qube_strategy=$(echo "$output" | grep "TEST_QUBE=" | cut -d'=' -f2)
            picslike_strategy=$(echo "$output" | grep "TEST_PICSLIKE=" | cut -d'=' -f2)
            meta_strategy=$(echo "$output" | grep "TEST_META=" | cut -d'=' -f2)

            echo "cosmocore-strategy=$cosmocore_strategy" >> $GITHUB_OUTPUT
            echo "qube-strategy=$qube_strategy" >> $GITHUB_OUTPUT
            echo "picslike-strategy=$picslike_strategy" >> $GITHUB_OUTPUT
            echo "meta-strategy=$meta_strategy" >> $GITHUB_OUTPUT
          else
            echo "test-all=false" >> $GITHUB_OUTPUT
            
            # Check individual packages - run job if ANY strategy is present (lint or test)
            cosmocore_strategy=$(echo "$output" | grep "TEST_COSMOCORE=" | cut -d'=' -f2)
            if [[ -n "$cosmocore_strategy" && "$cosmocore_strategy" != "none" ]]; then
              echo "test-cosmocore=true" >> $GITHUB_OUTPUT
              echo "cosmocore-strategy=$cosmocore_strategy" >> $GITHUB_OUTPUT
            else
              echo "test-cosmocore=false" >> $GITHUB_OUTPUT
              echo "cosmocore-strategy=none" >> $GITHUB_OUTPUT
            fi
            
            qube_strategy=$(echo "$output" | grep "TEST_QUBE=" | cut -d'=' -f2)
            if [[ -n "$qube_strategy" && "$qube_strategy" != "none" ]]; then
              echo "test-qube=true" >> $GITHUB_OUTPUT
              echo "qube-strategy=$qube_strategy" >> $GITHUB_OUTPUT
            else
              echo "test-qube=false" >> $GITHUB_OUTPUT
              echo "qube-strategy=none" >> $GITHUB_OUTPUT
            fi

            picslike_strategy=$(echo "$output" | grep "TEST_PICSLIKE=" | cut -d'=' -f2)
            if [[ -n "$picslike_strategy" && "$picslike_strategy" != "none" ]]; then
              echo "test-picslike=true" >> $GITHUB_OUTPUT
              echo "picslike-strategy=$picslike_strategy" >> $GITHUB_OUTPUT
            else
              echo "test-picslike=false" >> $GITHUB_OUTPUT
              echo "picslike-strategy=none" >> $GITHUB_OUTPUT
            fi

            meta_strategy=$(echo "$output" | grep "TEST_META=" | cut -d'=' -f2)
            if [[ -n "$meta_strategy" && "$meta_strategy" != "none" ]]; then
              echo "test-meta=true" >> $GITHUB_OUTPUT
              echo "meta-strategy=$meta_strategy" >> $GITHUB_OUTPUT
            else
              echo "test-meta=false" >> $GITHUB_OUTPUT
              echo "meta-strategy=none" >> $GITHUB_OUTPUT
            fi
          fi
          
          # Store the full strategy output for debugging
          strategy=$(echo "$output" | grep -A 20 "🧪 Test strategy:")
          echo "strategy<<EOF" >> $GITHUB_OUTPUT
          echo "$strategy" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  changelog:
    name: Changelog Updated
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only PRs: a direct push to master has no base to diff against, and the
    # release commits legitimately touch nothing but version strings.
    if: >
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a changelog entry when package source changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")

          # Importable package source only: src/cosmoforge.<pkg>/<pkg>/**.py.
          # tests/, benchmarks/, scripts/ and notebooks/ are siblings of the inner
          # package dir, so they never match — they move without a user-visible
          # change and must not trip this.
          SRC='^src/cosmoforge\.(cosmocore|qube|picslike)/(cosmocore|qube|picslike)/.*\.py$'

          if ! echo "$changed" | grep -qE "$SRC"; then
            echo "✅ No package source touched — changelog entry not required."
            exit 0
          fi

          if echo "$changed" | grep -q '^docs/source/changelog.rst$'; then
            echo "✅ docs/source/changelog.rst updated."
            exit 0
          fi

          echo "❌ This PR changes package source but does not update the changelog."
          echo ""
          echo "Add an entry under the 'Unreleased' heading in docs/source/changelog.rst"
          echo "describing the change in terms of the public surface a user touches:"
          echo "new/renamed/removed kwargs, changed defaults, new behaviour."
          echo ""
          echo "If the change genuinely has no user-visible surface (a pure internal"
          echo "refactor), apply the 'skip-changelog' label to this PR."
          echo ""
          echo "Package source files changed:"
          echo "$changed" | grep -E "$SRC" | sed 's/^/  /'
          exit 1

  test-cosmocore:
    name: Test CosmoCore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.test-cosmocore == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - mpi: false
            leg: nompi
          - mpi: true
            leg: mpi
    env:
      LEG: ${{ matrix.leg }}
      WITH_MPI: ${{ matrix.mpi }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MPI
        if: matrix.mpi
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install workspace dependencies
        run: |
          if [[ "$WITH_MPI" == "true" ]]; then
            uv sync --dev --extra mpi
          else
            uv sync --dev
          fi

      - name: Run linting
        if: ${{ !matrix.mpi }}
        run: |
          uv run ruff check src/cosmoforge.cosmocore/
          uv run ruff format --check src/cosmoforge.cosmocore/

      - name: Run tests
        if: contains(needs.detect-changes.outputs.cosmocore-strategy, 'test')
        working-directory: src/cosmoforge.cosmocore
        run: |
          uv run pytest tests/ -v --cov=cosmocore --cov-report=
          mv .coverage .coverage.serial

      - name: Run MPI tests (mpirun -n 2)
        if: matrix.mpi && contains(needs.detect-changes.outputs.cosmocore-strategy, 'test')
        working-directory: src/cosmoforge.cosmocore
        run: |
          mpirun -n 2 --oversubscribe \
            bash -c 'COVERAGE_FILE=.coverage.mpi.${OMPI_COMM_WORLD_RANK} \
              uv run pytest tests/test_mpi.py -v --cov=cosmocore --cov-report='

      - name: Combine coverage
        if: contains(needs.detect-changes.outputs.cosmocore-strategy, 'test')
        working-directory: src/cosmoforge.cosmocore
        run: |
          uv run coverage combine
          uv run coverage xml

      - name: Upload coverage to Codecov
        if: contains(needs.detect-changes.outputs.cosmocore-strategy, 'test')
        uses: codecov/codecov-action@v4
        with:
          file: src/cosmoforge.cosmocore/coverage.xml
          flags: cosmocore,${{ matrix.leg }}
          name: cosmocore-coverage-${{ matrix.leg }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ggalloni/CosmoForge

  test-qube:
    name: Test QUBE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.test-qube == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - mpi: false
            leg: nompi
          - mpi: true
            leg: mpi
    env:
      LEG: ${{ matrix.leg }}
      WITH_MPI: ${{ matrix.mpi }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MPI
        if: matrix.mpi && contains(needs.detect-changes.outputs.qube-strategy, 'test')
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install workspace dependencies
        run: |
          if [[ "$WITH_MPI" == "true" ]]; then
            uv sync --dev --extra mpi
          else
            uv sync --dev
          fi

      - name: Run linting
        if: ${{ !matrix.mpi }}
        run: |
          uv run ruff check src/cosmoforge.qube/
          uv run ruff format --check src/cosmoforge.qube/

      - name: Run tests
        if: contains(needs.detect-changes.outputs.qube-strategy, 'test')
        working-directory: src/cosmoforge.qube
        run: |
          uv run pytest tests/ -v --cov=qube --cov-report=
          mv .coverage .coverage.serial

      - name: Run MPI tests (mpirun -n 2)
        if: matrix.mpi && contains(needs.detect-changes.outputs.qube-strategy, 'test')
        working-directory: src/cosmoforge.qube
        run: |
          mpirun -n 2 --oversubscribe \
            bash -c 'COVERAGE_FILE=.coverage.mpi.${OMPI_COMM_WORLD_RANK} \
              uv run pytest tests/test_mpi.py -v --cov=qube --cov-report='

      - name: Combine coverage
        if: contains(needs.detect-changes.outputs.qube-strategy, 'test')
        working-directory: src/cosmoforge.qube
        run: |
          uv run coverage combine
          uv run coverage xml

      - name: Upload coverage to Codecov
        if: contains(needs.detect-changes.outputs.qube-strategy, 'test')
        uses: codecov/codecov-action@v4
        with:
          file: src/cosmoforge.qube/coverage.xml
          flags: qube,${{ matrix.leg }}
          name: qube-coverage-${{ matrix.leg }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ggalloni/CosmoForge

  test-picslike:
    name: Test PICSLike
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.test-picslike == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - mpi: false
            leg: nompi
          - mpi: true
            leg: mpi
    env:
      LEG: ${{ matrix.leg }}
      WITH_MPI: ${{ matrix.mpi }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MPI
        if: matrix.mpi && contains(needs.detect-changes.outputs.picslike-strategy, 'test')
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install workspace dependencies
        run: |
          if [[ "$WITH_MPI" == "true" ]]; then
            uv sync --dev --extra mpi
          else
            uv sync --dev
          fi

      - name: Run linting
        if: ${{ !matrix.mpi }}
        run: |
          uv run ruff check src/cosmoforge.picslike/
          uv run ruff format --check src/cosmoforge.picslike/

      - name: Run tests
        if: contains(needs.detect-changes.outputs.picslike-strategy, 'test')
        working-directory: src/cosmoforge.picslike
        run: |
          uv run pytest tests/ -v -m "not slow" --cov=picslike --cov-report=
          mv .coverage .coverage.serial

      - name: Run MPI tests (mpirun -n 2)
        if: matrix.mpi && contains(needs.detect-changes.outputs.picslike-strategy, 'test')
        working-directory: src/cosmoforge.picslike
        run: |
          mpirun -n 2 --oversubscribe \
            bash -c 'COVERAGE_FILE=.coverage.mpi.${OMPI_COMM_WORLD_RANK} \
              uv run pytest tests/test_mpi.py -v --cov=picslike --cov-report='

      - name: Combine coverage
        if: contains(needs.detect-changes.outputs.picslike-strategy, 'test')
        working-directory: src/cosmoforge.picslike
        run: |
          uv run coverage combine
          uv run coverage xml

      - name: Upload coverage to Codecov
        if: contains(needs.detect-changes.outputs.picslike-strategy, 'test')
        uses: codecov/codecov-action@v4
        with:
          file: src/cosmoforge.picslike/coverage.xml
          flags: picslike,${{ matrix.leg }}
          name: picslike-coverage-${{ matrix.leg }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ggalloni/CosmoForge

  test-meta:
    name: Test Meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.test-meta == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install workspace dependencies
        run: |
          uv sync --dev

      - name: Run linting
        run: |
          uv run ruff check src/cosmoforge.meta/
          uv run ruff format --check src/cosmoforge.meta/

      - name: Run tests
        if: contains(needs.detect-changes.outputs.meta-strategy, 'test')
        working-directory: src/cosmoforge.meta
        run: |
          uv run pytest tests/ -v

  test-notebooks:
    name: Test Notebooks (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes
    # The demo notebooks are single-process — they exercise no MPI — so they do
    # not belong in either leg of the package matrices. A dedicated job also runs
    # in parallel with them, keeping the workflow's critical path unchanged.
    if: |
      needs.detect-changes.outputs.test-qube == 'true' ||
      needs.detect-changes.outputs.test-picslike == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: [qube, picslike]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      # The jupyter group supplies nbclient/nbformat/ipykernel; matplotlib (which
      # the notebooks plot with) comes from the dev group. Without the group,
      # test_notebooks.py importorskips — which is exactly why these tests never
      # ran in CI before.
      # `matrix` is not available in a job-level `if`, so the per-package gate
      # lives on the steps: without it the matrix would run BOTH notebook suites
      # whenever EITHER package is affected.
      - name: Install workspace dependencies
        if: needs.detect-changes.outputs[format('test-{0}', matrix.package)] == 'true'
        run: |
          uv sync --dev --group jupyter

      # Run from the workspace root: the `jupyter` group is declared in the root
      # pyproject, and `uv run --group` resolves groups against the pyproject of
      # the directory it runs in — from inside the package it errors out.
      - name: Execute notebooks headless
        if: needs.detect-changes.outputs[format('test-{0}', matrix.package)] == 'true'
        run: |
          uv run --group jupyter pytest \
            src/cosmoforge.${{ matrix.package }}/tests/test_notebooks.py -v

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, test-cosmocore, test-qube, test-picslike, test-meta, test-notebooks]
    if: always()
    steps:
      - name: Print test strategy
        run: |
          echo "## Test Strategy Summary"
          echo "Affected packages: ${{ needs.detect-changes.outputs.affected-packages }}"
          echo ""
          echo "${{ needs.detect-changes.outputs.strategy }}"
          echo ""
          echo "## Test Results"
          echo "- CosmoCore: ${{ needs.test-cosmocore.result }} (strategy: ${{ needs.detect-changes.outputs.cosmocore-strategy }})"
          echo "- QUBE: ${{ needs.test-qube.result }} (strategy: ${{ needs.detect-changes.outputs.qube-strategy }})"
          echo "- PICSLike: ${{ needs.test-picslike.result }} (strategy: ${{ needs.detect-changes.outputs.picslike-strategy }})"
          echo "- Meta: ${{ needs.test-meta.result }} (strategy: ${{ needs.detect-changes.outputs.meta-strategy }})"
          echo "- Notebooks: ${{ needs.test-notebooks.result }}"
          echo ""
          echo "## Coverage Notes"
          if [[ "${{ needs.detect-changes.outputs.test-cosmocore }}" == "false" ]]; then
            echo "- CosmoCore: No changes detected, coverage preserved from previous runs"
          fi
          if [[ "${{ needs.detect-changes.outputs.test-qube }}" == "false" ]]; then
            echo "- QUBE: No changes detected, coverage preserved from previous runs"
          fi
          if [[ "${{ needs.detect-changes.outputs.test-picslike }}" == "false" ]]; then
            echo "- PICSLike: No changes detected, coverage preserved from previous runs"
          fi
          echo "- Meta: No coverage tracking (package contains no source code to cover)"

      - name: Check if all tests passed
        run: |
          if [[ "${{ needs.test-cosmocore.result }}" == "failure" ]] || \
             [[ "${{ needs.test-qube.result }}" == "failure" ]] || \
             [[ "${{ needs.test-picslike.result }}" == "failure" ]] || \
             [[ "${{ needs.test-meta.result }}" == "failure" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed or were skipped appropriately"
          fi
