name: Test CosmoForge Packages

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      affected-packages: ${{ steps.changes.outputs.affected-packages }}
      test-cosmocore: ${{ steps.changes.outputs.test-cosmocore }}
      test-quelo: ${{ steps.changes.outputs.test-quelo }}
      test-meta: ${{ steps.changes.outputs.test-meta }}
      test-all: ${{ steps.changes.outputs.test-all }}
      cosmocore-strategy: ${{ steps.changes.outputs.cosmocore-strategy }}
      quelo-strategy: ${{ steps.changes.outputs.quelo-strategy }}
      meta-strategy: ${{ steps.changes.outputs.meta-strategy }}
      strategy: ${{ steps.changes.outputs.strategy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Detect changes and determine test strategy
        id: changes
        run: |
          # Run the change detection script
          output=$(python scripts/detect-changes.py origin/${{ github.event.repository.default_branch }})
          echo "$output"
          
          # Parse the output to set GitHub Actions outputs
          affected_packages=$(echo "$output" | grep "AFFECTED_PACKAGES=" | cut -d'=' -f2)
          
          # Set outputs for each package
          echo "affected-packages=$affected_packages" >> $GITHUB_OUTPUT
          
          # Check if we need to test all packages
          if echo "$output" | grep -q "TEST_ALL="; then
            echo "test-all=true" >> $GITHUB_OUTPUT
            echo "test-cosmocore=true" >> $GITHUB_OUTPUT
            echo "test-quelo=true" >> $GITHUB_OUTPUT
            echo "test-meta=true" >> $GITHUB_OUTPUT
            
            # Parse individual strategies even in TEST_ALL case
            cosmocore_strategy=$(echo "$output" | grep "TEST_COSMOCORE=" | cut -d'=' -f2)
            quelo_strategy=$(echo "$output" | grep "TEST_QUELO=" | cut -d'=' -f2)
            meta_strategy=$(echo "$output" | grep "TEST_META=" | cut -d'=' -f2)
            
            echo "cosmocore-strategy=$cosmocore_strategy" >> $GITHUB_OUTPUT
            echo "quelo-strategy=$quelo_strategy" >> $GITHUB_OUTPUT
            echo "meta-strategy=$meta_strategy" >> $GITHUB_OUTPUT
          else
            echo "test-all=false" >> $GITHUB_OUTPUT
            
            # Check individual packages - run job if ANY strategy is present (lint or test)
            cosmocore_strategy=$(echo "$output" | grep "TEST_COSMOCORE=" | cut -d'=' -f2)
            if [[ -n "$cosmocore_strategy" && "$cosmocore_strategy" != "none" ]]; then
              echo "test-cosmocore=true" >> $GITHUB_OUTPUT
              echo "cosmocore-strategy=$cosmocore_strategy" >> $GITHUB_OUTPUT
            else
              echo "test-cosmocore=false" >> $GITHUB_OUTPUT
              echo "cosmocore-strategy=none" >> $GITHUB_OUTPUT
            fi
            
            quelo_strategy=$(echo "$output" | grep "TEST_QUELO=" | cut -d'=' -f2)
            if [[ -n "$quelo_strategy" && "$quelo_strategy" != "none" ]]; then
              echo "test-quelo=true" >> $GITHUB_OUTPUT
              echo "quelo-strategy=$quelo_strategy" >> $GITHUB_OUTPUT
            else
              echo "test-quelo=false" >> $GITHUB_OUTPUT
              echo "quelo-strategy=none" >> $GITHUB_OUTPUT
            fi
            
            meta_strategy=$(echo "$output" | grep "TEST_META=" | cut -d'=' -f2)
            if [[ -n "$meta_strategy" && "$meta_strategy" != "none" ]]; then
              echo "test-meta=true" >> $GITHUB_OUTPUT
              echo "meta-strategy=$meta_strategy" >> $GITHUB_OUTPUT
            else
              echo "test-meta=false" >> $GITHUB_OUTPUT
              echo "meta-strategy=none" >> $GITHUB_OUTPUT
            fi
          fi
          
          # Store the full strategy output for debugging
          strategy=$(echo "$output" | grep -A 20 "🧪 Test strategy:")
          echo "strategy<<EOF" >> $GITHUB_OUTPUT
          echo "$strategy" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  test-cosmocore:
    name: Test CosmoCore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.test-cosmocore == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install workspace dependencies
        run: |
          uv sync --dev

      - name: Run linting
        run: |
          uv run ruff check src/cosmoforge.cosmocore/
          uv run ruff format --check src/cosmoforge.cosmocore/

      - name: Run tests
        if: contains(needs.detect-changes.outputs.cosmocore-strategy, 'test')
        working-directory: src/cosmoforge.cosmocore
        run: |
          uv run pytest tests/ -v --cov=cosmocore --cov-report=xml

      - name: Upload coverage to Codecov
        if: contains(needs.detect-changes.outputs.cosmocore-strategy, 'test')
        uses: codecov/codecov-action@v4
        with:
          file: src/cosmoforge.cosmocore/coverage.xml
          flags: cosmocore
          name: cosmocore-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ggalloni/CosmoForge

  test-quelo:
    name: Test Quelo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.test-quelo == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MPI
        if: contains(needs.detect-changes.outputs.quelo-strategy, 'test')
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install workspace dependencies
        run: |
          uv sync --dev

      - name: Run linting
        run: |
          uv run ruff check src/cosmoforge.quelo/
          uv run ruff format --check src/cosmoforge.quelo/

      - name: Run tests
        if: contains(needs.detect-changes.outputs.quelo-strategy, 'test')
        working-directory: src/cosmoforge.quelo
        run: |
          uv run pytest tests/ -v --cov=quelo --cov-report=xml

      - name: Run MPI test
        if: contains(needs.detect-changes.outputs.quelo-strategy, 'test')
        working-directory: src/cosmoforge.quelo
        run: |
          mpirun --oversubscribe -np 2 uv run pytest -k mpi -v --cov=quelo --cov-append --cov-report=xml

      - name: Upload coverage to Codecov
        if: contains(needs.detect-changes.outputs.quelo-strategy, 'test')
        uses: codecov/codecov-action@v4
        with:
          file: src/cosmoforge.quelo/coverage.xml
          flags: quelo
          name: quelo-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ggalloni/CosmoForge

  test-meta:
    name: Test Meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.test-meta == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MPI
        if: contains(needs.detect-changes.outputs.meta-strategy, 'test')
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install workspace dependencies
        run: |
          uv sync --dev

      - name: Run linting
        run: |
          uv run ruff check src/cosmoforge.meta/
          uv run ruff format --check src/cosmoforge.meta/

      - name: Run tests
        if: contains(needs.detect-changes.outputs.meta-strategy, 'test')
        working-directory: src/cosmoforge.meta
        run: |
          uv run pytest tests/ -v

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, test-cosmocore, test-quelo, test-meta]
    if: always()
    steps:
      - name: Print test strategy
        run: |
          echo "## Test Strategy Summary"
          echo "Affected packages: ${{ needs.detect-changes.outputs.affected-packages }}"
          echo ""
          echo "${{ needs.detect-changes.outputs.strategy }}"
          echo ""
          echo "## Test Results"
          echo "- CosmoCore: ${{ needs.test-cosmocore.result }} (strategy: ${{ needs.detect-changes.outputs.cosmocore-strategy }})"
          echo "- Quelo: ${{ needs.test-quelo.result }} (strategy: ${{ needs.detect-changes.outputs.quelo-strategy }})"
          echo "- Meta: ${{ needs.test-meta.result }} (strategy: ${{ needs.detect-changes.outputs.meta-strategy }})"
          echo ""
          echo "## Coverage Notes"
          if [[ "${{ needs.detect-changes.outputs.test-cosmocore }}" == "false" ]]; then
            echo "- CosmoCore: No changes detected, coverage preserved from previous runs"
          fi
          if [[ "${{ needs.detect-changes.outputs.test-quelo }}" == "false" ]]; then
            echo "- Quelo: No changes detected, coverage preserved from previous runs"
          fi
          echo "- Meta: No coverage tracking (package contains no source code to cover)"

      - name: Check if all tests passed
        run: |
          if [[ "${{ needs.test-cosmocore.result }}" == "failure" ]] || \
             [[ "${{ needs.test-quelo.result }}" == "failure" ]] || \
             [[ "${{ needs.test-meta.result }}" == "failure" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed or were skipped appropriately"
          fi
