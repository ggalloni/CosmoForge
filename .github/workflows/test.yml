name: Test CosmoForge Packages

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      affected-packages: ${{ steps.changes.outputs.affected-packages }}
      test-cosmocore: ${{ steps.changes.outputs.test-cosmocore }}
      test-quelo: ${{ steps.changes.outputs.test-quelo }}
      test-meta: ${{ steps.changes.outputs.test-meta }}
      test-all: ${{ steps.changes.outputs.test-all }}
      strategy: ${{ steps.changes.outputs.strategy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Detect changes and determine test strategy
        id: changes
        run: |
          # Make the script executable
          chmod +x scripts/detect-changes.py
          
          # Run the change detection script
          output=$(python scripts/detect-changes.py origin/${{ github.event.repository.default_branch }})
          echo "$output"
          
          # Parse the output to set GitHub Actions outputs
          affected_packages=$(echo "$output" | grep "AFFECTED_PACKAGES=" | cut -d'=' -f2)
          
          # Set outputs for each package
          echo "affected-packages=$affected_packages" >> $GITHUB_OUTPUT
          
          # Check if we need to test all packages
          if echo "$output" | grep -q "TEST_ALL="; then
            echo "test-all=true" >> $GITHUB_OUTPUT
            echo "test-cosmocore=true" >> $GITHUB_OUTPUT
            echo "test-quelo=true" >> $GITHUB_OUTPUT
            echo "test-meta=true" >> $GITHUB_OUTPUT
          else
            echo "test-all=false" >> $GITHUB_OUTPUT
            
            # Check individual packages
            if echo "$output" | grep -q "TEST_COSMOCORE="; then
              echo "test-cosmocore=true" >> $GITHUB_OUTPUT
            else
              echo "test-cosmocore=false" >> $GITHUB_OUTPUT
            fi
            
            if echo "$output" | grep -q "TEST_QUELO="; then
              echo "test-quelo=true" >> $GITHUB_OUTPUT
            else
              echo "test-quelo=false" >> $GITHUB_OUTPUT
            fi
            
            if echo "$output" | grep -q "TEST_META="; then
              echo "test-meta=true" >> $GITHUB_OUTPUT
            else
              echo "test-meta=false" >> $GITHUB_OUTPUT
            fi
          fi
          
          # Store the full strategy output for debugging
          strategy=$(echo "$output" | grep -A 20 "🧪 Test strategy:")
          echo "strategy<<EOF" >> $GITHUB_OUTPUT
          echo "$strategy" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  test-cosmocore:
    name: Test CosmoCore
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.test-cosmocore == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install workspace dependencies
        run: |
          uv sync --dev

      - name: Run linting
        run: |
          uv run ruff check src/cosmoforge.cosmocore/
          uv run ruff format --check src/cosmoforge.cosmocore/

      - name: Run tests
        working-directory: src/cosmoforge.cosmocore
        run: |
          uv run pytest tests/ -v --cov=cosmocore --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: src/cosmoforge.cosmocore/coverage.xml
          flags: cosmocore
          name: cosmocore-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ggalloni/CosmoForge

  test-quelo:
    name: Test Quelo
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.test-quelo == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install workspace dependencies
        run: |
          uv sync --dev

      - name: Run linting
        run: |
          uv run ruff check src/cosmoforge.quelo/
          uv run ruff format --check src/cosmoforge.quelo/

      - name: Run tests
        working-directory: src/cosmoforge.quelo
        run: |
          uv run pytest tests/ -v --cov=quelo --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: src/cosmoforge.quelo/coverage.xml
          flags: quelo
          name: quelo-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ggalloni/CosmoForge

  test-meta:
    name: Test Meta
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.test-meta == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install workspace dependencies
        run: |
          uv sync --dev

      - name: Run linting
        run: |
          uv run ruff check src/cosmoforge.meta/
          uv run ruff format --check src/cosmoforge.meta/

      - name: Run tests
        working-directory: src/cosmoforge.meta
        run: |
          uv run pytest tests/ -v --cov=meta --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: src/cosmoforge.meta/coverage.xml
          flags: meta
          name: meta-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ggalloni/CosmoForge

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, test-cosmocore, test-quelo, test-meta]
    if: |
      always() && 
      needs.detect-changes.outputs.test-all == 'true' &&
      (needs.test-cosmocore.result == 'success' || needs.test-cosmocore.result == 'skipped') &&
      (needs.test-quelo.result == 'success' || needs.test-quelo.result == 'skipped') &&
      (needs.test-meta.result == 'success' || needs.test-meta.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install all packages
        run: |
          uv sync --dev

      - name: Run integration tests
        run: |
          # Run tests that span multiple packages
          echo "Running integration tests..."
          # Add your integration test commands here

  combined-coverage:
    name: Combined Coverage Report
    runs-on: ubuntu-latest
    needs: [detect-changes, test-cosmocore, test-quelo, test-meta]
    if: |
      always() &&
      (needs.test-cosmocore.result == 'success' || needs.test-quelo.result == 'success' || needs.test-meta.result == 'success')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Download coverage artifacts
        continue-on-error: true
        run: |
          # Create coverage directory
          mkdir -p coverage-reports
          
          # Try to copy coverage files if they exist
          if [ -f "src/cosmoforge.cosmocore/coverage.xml" ]; then
            cp src/cosmoforge.cosmocore/coverage.xml coverage-reports/cosmocore-coverage.xml
          fi
          if [ -f "src/cosmoforge.quelo/coverage.xml" ]; then
            cp src/cosmoforge.quelo/coverage.xml coverage-reports/quelo-coverage.xml
          fi
          if [ -f "src/cosmoforge.meta/coverage.xml" ]; then
            cp src/cosmoforge.meta/coverage.xml coverage-reports/meta-coverage.xml
          fi

      - name: Generate combined coverage report
        run: |
          # Install coverage if not already installed
          uv add coverage[toml]
          
          # Run coverage across all packages for combined report
          uv run coverage run --source=src/ -m pytest src/*/tests/ || true
          uv run coverage xml -o combined-coverage.xml
          uv run coverage report --show-missing

      - name: Upload combined coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: combined-coverage.xml
          flags: combined
          name: combined-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ggalloni/CosmoForge

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, test-cosmocore, test-quelo, test-meta, integration-tests, combined-coverage]
    if: always()
    steps:
      - name: Print test strategy
        run: |
          echo "## Test Strategy Summary"
          echo "Affected packages: ${{ needs.detect-changes.outputs.affected-packages }}"
          echo ""
          echo "${{ needs.detect-changes.outputs.strategy }}"
          echo ""
          echo "## Test Results"
          echo "- CosmoCore: ${{ needs.test-cosmocore.result }}"
          echo "- Quelo: ${{ needs.test-quelo.result }}"
          echo "- Meta: ${{ needs.test-meta.result }}"
          echo "- Integration: ${{ needs.integration-tests.result }}"

      - name: Check if all tests passed
        run: |
          if [[ "${{ needs.test-cosmocore.result }}" == "failure" ]] || \
             [[ "${{ needs.test-quelo.result }}" == "failure" ]] || \
             [[ "${{ needs.test-meta.result }}" == "failure" ]] || \
             [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed or were skipped appropriately"
          fi
