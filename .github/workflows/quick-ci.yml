name: Quick CI

on:
  pull_request:
    branches: [ master ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  quick-test:
    name: Quick Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Detect changes and run targeted tests
        run: |
          chmod +x scripts/detect-changes.py
          
          # Detect changes
          echo "🔍 Detecting changes..."
          python scripts/detect-changes.py origin/${{ github.event.repository.default_branch }}
          
          # Store output for parsing
          output=$(python scripts/detect-changes.py origin/${{ github.event.repository.default_branch }})
          
          # Test CosmoCore if needed
          if echo "$output" | grep -q "TEST_COSMOCORE="; then
            echo "🧪 Testing CosmoCore..."
            cd src/cosmoforge.cosmocore
            uv sync --dev
            uv run ruff check .
            uv run pytest tests/ -v
            cd ../..
          fi
          
          # Test Quelo if needed
          if echo "$output" | grep -q "TEST_QUELO="; then
            echo "🧪 Testing Quelo..."
            cd src/cosmoforge.quelo
            uv sync --dev
            uv run ruff check .
            uv run pytest tests/ -v
            cd ../..
          fi
          
          # Test Meta if needed
          if echo "$output" | grep -q "TEST_META="; then
            echo "🧪 Testing Meta..."
            cd src/cosmoforge.meta
            uv sync --dev
            uv run ruff check .
            uv run pytest tests/ -v
            cd ../..
          fi
          
          # Test all if root files changed
          if echo "$output" | grep -q "TEST_ALL="; then
            echo "🧪 Testing all packages..."
            uv sync --dev
            
            # Test each package
            for package in cosmoforge.cosmocore cosmoforge.quelo cosmoforge.meta; do
              if [ -d "src/$package" ]; then
                echo "Testing $package..."
                cd "src/$package"
                uv run ruff check .
                uv run pytest tests/ -v
                cd ../..
              fi
            done
          fi
