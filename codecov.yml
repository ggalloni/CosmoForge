coverage:
  status:
    project:
      default:
        target: 75%
        threshold: 1%
    patch:
      default:
        target: 70%
        threshold: 1%

  flag_management:
    default_rules:
      carryforward: true

flags:
  cosmocore:
    paths:
      - src/cosmoforge.cosmocore/
  quelo:
    paths:
      - src/cosmoforge.quelo/
  meta:
    paths:
      - src/cosmoforge.meta/

ignore:
  - "*/tests/*"
  - "*/test_*"
  - "*/__pycache__/*"
  - "*/conftest.py"
  - "*/setup.py"
  - "*/.pytest_cache/*"
  - "*/egg-info/*"

comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false
